# ============================================================================
# DevContainer Docker Compose 配置文件示例
# ============================================================================
#
# ⚠️ 重要提示：
# 1. 此文件是示例配置，位于 `.devcontainer/example-compose/` 目录
# 2. 需要配合 devcontainer.json 使用
# 3. 使用预构建镜像：首次使用前需要运行 .devcontainer/docker/scripts/build 构建镜像
# 4. 使用方法：将此文件和 devcontainer.json 复制到 .devcontainer/ 目录
#
# 📋 复制到 .devcontainer/ 后的配置修改说明：
# ┌────────────────────────────────────────────────────────────────────────┐
# │ 配置项                  │ 是否需要修改 │ 说明 │
# ├────────────────────────────────────────────────────────────────────────┤
# │ image                  │ ❌ 否       │ 镜像配置保持不变 │
# │ dockerComposeFile      │ ❌ 否       │ 同级文件，路径不变 │
# │ service                │ ❌ 否       │ 服务名不变 │
# │ ⚠️ env_file            │ ✅ **是**  │ ../.env → .env │
# │ ⚠️ volumes 路径        │ ✅ **是**  │ 详见下方详细说明 │
# │ ⚠️ workspaceFolder     │ ❌ 否       │ 容器内绝对路径，不变 │
# └────────────────────────────────────────────────────────────────────────┘
#
# ⚠️⚠️⚠️ 重要：docker-compose.yml 中的路径必须修改！⚠️⚠️⚠️
#
# 路径修改对照：
# ┌────────────────────────────────────────────────────────────────────────┐
# │ 配置项                │ example-compose/ 路径 │ .devcontainer/ 路径 │
# ├────────────────────────────────────────────────────────────────────────┤
# │ env_file             │ ../.env              │ .env                 │
# │ 工作空间挂载          │ ../..                │ ..                   │
# │ Python 虚拟环境       │ ../data/.venv        │ ./data/.venv         │
# │ 通用数据目录          │ ../data              │ ./data               │
# │ Go 缓存目录           │ ../data/go/cache     │ ./data/go/cache      │
# │ Go PATH 目录          │ ../data/go/path      │ ./data/go/path       │
# └────────────────────────────────────────────────────────────────────────┘
#
# 路径解析说明：
# - 本文件位于：.devcontainer/example-compose/docker-compose.yml
# - .env 文件位于：.devcontainer/.env
# - data 目录位于：.devcontainer/data/
# - 相对路径：
#   - .env: ../.env （向上到 .devcontainer/）
#   - data: ../data/ （向上到 .devcontainer/，然后进入 data/）
#
# 复制到 .devcontainer/ 后：
# - 文件位于：.devcontainer/docker-compose.yml
# - .env 文件位于：.devcontainer/.env
# - data 目录位于：.devcontainer/data/
# - 相对路径：
#   - .env: .env （同级目录）
#   - data: ./data/ （同级目录直接进入）
#
# 复制命令：
#   cd .devcontainer
#   cp example-compose/devcontainer.json devcontainer.json
#   cp example-compose/docker-compose.yml docker-compose.yml
#   # 然后按上方对照表修改 docker-compose.yml 中的路径
#
# 主要功能：
# - 定义开发容器服务配置
# - 配置环境变量和卷挂载
# - 设置端口转发和网络配置
# - 支持多服务编排（如需要可添加数据库等服务）
# ============================================================================

# ========== Compose 项目名称配置 ==========
# 设置 Docker Compose 的项目名称。
# 此名称会影响容器、网络、卷等资源的命名前缀。
#
# 命名规则：
#   - 必须由小写字母、数字和下划线组成
#   - 必须以字母开头
#
# 影响范围：
#   - 容器名称：${COMPOSE_PROJECT_NAME}_service_name_index
#   - 网络名称：${COMPOSE_PROJECT_NAME}_default
#   - 卷名称：${COMPOSE_PROJECT_NAME}_volume_name
#
# 优先级（从高到低）：
#   1. 命令行参数：docker-compose -p PROJECT_NAME
#   2. 环境变量：COMPOSE_PROJECT_NAME
#   3. .env 文件中的 COMPOSE_PROJECT_NAME
#   4. 以下 name 字段（Docker Compose v2.0+）
#   5. 目录名（默认）
#
# 注意：此功能需要 Docker Compose v2.0+ 版本支持。
name: ${COMPOSE_PROJECT_NAME:-kratos-layout-dev}

services:
  # ========== 开发容器服务 ==========
  # 主要的开发容器服务，包含完整的 Go 开发环境。
  app:
    # ========== 镜像配置 ==========
    # 使用预构建的 Docker 镜像，无需现场构建。
    # ✅ 复制到 .devcontainer/ 目录后，镜像配置保持不变
    # 镜像来源：${IMAGE_REPO}:${IMAGE_TAG}
    #
    # 通过环境变量配置镜像（推荐方式）：
    #   1. 在 .env 文件中设置（项目级）
    #   2. 在宿主机环境变量中设置（全局）
    #   3. 在 docker-compose.yml 中设置默认值（当前）
    #
    # 环境变量说明：
    #   IMAGE_REPO: 镜像仓库地址（默认：fsyyft/devcontainer/ubuntu/go）
    #   IMAGE_TAG:  镜像版本标签（默认：latest）
    #
    # 可用版本标签示例：
    #   - latest: 最新版本（默认）
    #   - ubuntu24.04.YYMMDDNN: Ubuntu 24.04 特定构建版本
    #   - ubuntu22.04.YYMMDDNN: Ubuntu 22.04 特定构建版本
    #
    # 使用示例：
    #   1. 使用默认镜像（latest）：
    #      docker-compose up
    #
    #   2. 指定镜像版本：
    #      IMAGE_TAG=ubuntu24.04.26011101 docker-compose up
    #
    #   3. 使用自定义镜像仓库：
    #      IMAGE_REPO=myrepo/custom-image IMAGE_TAG=v1.0 docker-compose up
    image: ${IMAGE_REPO:-fsyyft/devcontainer/ubuntu/go}:${IMAGE_TAG:-latest}

    # ========== 容器名称 ==========
    # 容器名称，便于识别和管理。
    # 支持通过环境变量 CONTAINER_NAME 自定义容器名称。
    # 默认值：kratos-layout-dev
    container_name: ${CONTAINER_NAME:-kratos-layout-dev}

    # ========== 安全和调试配置 ==========
    # 添加必要的 Linux 能力，允许调试器使用。
    cap_add:
      - SYS_PTRACE

    # 安全选项配置。
    security_opt:
      - seccomp:unconfined

    # ========== 环境变量文件配置 ==========
    # 从指定文件加载环境变量。
    # 文件路径相对于 docker-compose.yml 所在目录。
    #
    # ⚠️ 路径说明：
    # - 当前：.devcontainer/example-compose/docker-compose.yml
    # - .env 位置：.devcontainer/.env
    # - 相对路径：../.env
    #
    # 复制到 .devcontainer/ 后：
    # - 文件位置：.devcontainer/docker-compose.yml
    # - .env 位置：.devcontainer/.env
    # - 相对路径：.env （必须修改！）
    #
    # .env 文件格式：
    #   IMAGE_REPO=fsyyft/devcontainer/ubuntu/go
    #   IMAGE_TAG=latest
    #   CONTAINER_NAME=kratos-layout-dev
    #   HOSTNAME=kratos-dev
    #   ANTHROPIC_BASE_URL=https://api.anthropic.com
    #   ANTHROPIC_MODEL=claude-sonnet-4-5-20250929
    #   ANTHROPIC_SMALL_FAST_MODEL=claude-haiku-4-20250521
    #   ANTHROPIC_API_KEY=your_api_key_here
    #   ANTHROPIC_AUTH_TOKEN=your_auth_token_here
    #
    # 注意事项：
    #   - .env 文件中的变量会覆盖 docker-compose.yml 中的默认值
    #   - 宿主机环境变量优先级最高，会覆盖 .env 文件中的值
    #   - 建议将 .env 文件添加到 .gitignore，避免敏感信息泄露
    #   - 可以提供 .env.example 文件作为模板
    #   - 确保 .env 文件存在于 .devcontainer/ 目录
    env_file:
      - ../.env

    # ========== 环境变量配置 ==========
    # 容器内环境变量，影响容器运行时的行为。
    environment:
      # ========== 时区和语言配置 ==========
      TZ: Asia/Shanghai
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8

      # ========== Claude Code 配置 ==========
      # 禁用 Claude Code 的非必要网络流量。
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

      # ========== Claude Code API 配置 ==========
      # 以下环境变量从宿主机环境传递到容器。
      # 在运行时，这些值会从宿主机的环境变量中读取。
      #
      # Anthropic API 基础 URL（用于自定义 API 端点）。
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}

      # Anthropic 主要模型（用于复杂任务）。
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}

      # Anthropic 快速模型（用于简单任务）。
      ANTHROPIC_SMALL_FAST_MODEL: ${ANTHROPIC_SMALL_FAST_MODEL}

      # Anthropic API 密钥（用于身份验证）。
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # Anthropic 认证令牌（用于 Claude Code CLI 认证）。
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN}

      # ========== Anthropic 日志配置（可选） ==========
      # 日志级别，用于调试和问题排查。
      # 可选值：
      #   - debug:   显示详细的 API 请求日志
      #   - info:    显示基本信息级别的日志
      #   - warn:    仅显示警告和错误信息
      #   - error:   仅显示错误信息
      # 取消注释以下行以启用调试日志：
      # ANTHROPIC_LOG: debug

    # ========== 网络配置 ==========
    # 主机名配置。
    # 支持通过环境变量 HOSTNAME 自定义容器主机名。
    # 默认值：kratos-dev
    hostname: ${HOSTNAME:-kratos-dev}

    # 端口映射配置。
    # 格式：主机端口:容器端口
    # ✅ 复制到 .devcontainer/ 目录后，端口配置保持不变
    # 主机端口设置为 0，表示由 Docker 自动分配可用的宿主机端口。
    # 使用 docker port <container_name> 命令查看实际分配的端口。
    ports:
      # SSH 服务端口。
      - "0:22"

      # Web 服务端口（HTTP API）。
      - "0:8000"

      # Task 服务端口（后台任务服务）。
      - "0:8001"

      # gRPC 服务端口。
      - "0:9000"

    # ========== 卷挂载配置 ==========
    # 定义数据卷挂载，用于持久化数据和共享资源。
    #
    # ⚠️ 路径说明：这些路径相对于 docker-compose.yml 所在目录
    #
    # [当前配置文件位置] .devcontainer/example-compose/docker-compose.yml
    # [data 目录位置]     .devcontainer/data/
    # [相对路径]          ../data/ （向上到 .devcontainer/，然后进入 data/）
    #
    # [复制到 .devcontainer/ 后]
    # [配置文件位置]      .devcontainer/docker-compose.yml
    # [data 目录位置]     .devcontainer/data/
    # [相对路径]          ./data/ （同级目录直接进入）
    #
    # 警告 复制到 .devcontainer/ 目录后，卷挂载路径需要变更（使用 ./ 相对路径）
    volumes:
      # ========== Docker Socket 挂载 ==========
      # 挂载 Docker socket，允许容器内运行 Docker 命令（Docker-in-Docker）。
      # 这种方式：
      # - 优点：性能更好，直接访问宿主机镜像
      # - 缺点：隔离性较低，存在安全风险
      - /var/run/docker.sock:/var/run/docker.sock

      # ========== 工作空间挂载 ==========
      # 挂载项目工作目录。
      # ${localWorkspaceFolder} 会被 DevContainer 替换为本地项目路径。
      #
      # 路径说明：
      # - ../.. 从 example-compose/ 向上两级到项目根目录
      # - 复制到 .devcontainer/ 后改为 .. （向上一级到项目根目录）
      - ../..:/development/github.com/fsyyft-go/kratos-layout

      # ========== 数据目录挂载 ==========
      # ⚠️ 注意：以下路径在复制到 .devcontainer/ 后必须修改为 ./data/*

      # 挂载 Python 虚拟环境目录，避免每次重建容器时重新安装依赖。
      # 路径：../data/.venv → .devcontainer/data/.venv
      - ../data/.venv:/development/github.com/fsyyft-go/kratos-layout/.venv

      # 挂载通用数据目录，用于持久化其他数据。
      # 路径：../data → .devcontainer/data/
      - ../data:/data

      # 挂载 Go 缓存目录，加速 Go 模块下载。
      # 路径：../data/go/cache → .devcontainer/data/go/cache
      - ../data/go/cache:/usr/local/go/cache

      # 挂载 Go GOPATH 目录，持久化 Go 依赖和工具。
      # 路径：../data/go/path → .devcontainer/data/go/path
      - ../data/go/path:/usr/local/go/path

    # ========== 工作目录配置 ==========
    # 容器内的工作目录路径。
    working_dir: /development/github.com/fsyyft-go/kratos-layout

    # ========== 用户配置 ==========
    # 容器启动后使用的用户。
    #
    # 重要说明：
    # 此处不设置 user，让容器以 root 用户运行，确保 SSH 守护进程等系统服务可以正常启动。
    # 用户切换通过 devcontainer.json 中的 remoteUser 配置实现。
    #
    # 该用户必须在 Dockerfile 中创建（UID: 327, GID: 0）。
    # user: fsyyft