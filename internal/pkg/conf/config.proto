// 指定 Protocol Buffers 语法版本为 proto3。
syntax = "proto3";

// 指定生成的 Go 代码的包路径和包名。
package internal.conf;

// 指定生成的 Go 代码的包路径和包名。
option go_package = "github.com/fsyyft-go/kratos-layout/internal/pkg/conf;conf";

// 导入 google.protobuf.Duration 类型。
import "google/protobuf/duration.proto";

// Config 定义应用程序的配置结构，包含所有子系统的配置信息。
message Config {
  // Log 配置应用程序的日志系统。
  Log log = 1;
  // Server 配置应用程序的服务器设置。
  Server server = 2;
  // Register 配置应用程序的注册系统。
  Register register = 3;
}

// Log 定义日志系统的详细配置参数。
message Log {
  // type 指定日志系统类型，支持 logrus 等日志框架。
  string type = 1;
  // output 指定日志输出的目标路径，可以是文件路径或特殊值（如 stdout）。
  string output = 2;
  // level 指定日志记录的级别，可选值包括：debug、info、warn、error。
  string level = 3;
}

// Server 定义服务器相关的配置参数。
message Server {
  // HTTP 定义 HTTP 服务器的配置参数。
  message HTTP {
    // network 指定网络类型，如 tcp、tcp4、tcp6 等。
    string network = 1;
    // addr 指定服务器监听的地址和端口，格式为 host:port。
    string addr = 2;
    // timeout 定义 HTTP 请求的超时时间。
    google.protobuf.Duration timeout = 3;
  }
  // 定义 HTTP 服务器的配置参数。
  HTTP http = 1;
}

// RegisterType 定义注册系统类型的枚举。
enum RegisterType {
  // REGISTER_TYPE_UNSPECIFIED 表示未指定，等同于不开启注册。
  REGISTER_TYPE_UNSPECIFIED = 0;
  // REGISTER_TYPE_NACOS 表示使用 Nacos 作为注册系统。
  REGISTER_TYPE_NACOS = 1;
}

// Register 配置应用程序的注册系统。
message Register {
  // Nacos 配置 Nacos 注册系统的参数。
  message Nacos {
    // NacosClient 配置 Nacos 客户端的详细参数。
    // 用于定制客户端行为，包括超时设置、心跳间隔、缓存策略和日志配置等。
    message Client {
      // timeout_ms 指定客户端请求的超时时间，单位为毫秒。
      int32 timeout_ms = 1;
      // beat_interval_ms 指定心跳间隔，用于与 Nacos
      // 服务器保持连接活跃，单位为毫秒。
      int32 beat_interval_ms = 2;
      // open_kms 指定是否启用 KMS（密钥管理服务）加密。
      bool open_kms = 3;
      // cache_dir 指定本地缓存目录的路径，用于存储服务列表等缓存数据。
      string cache_dir = 4;
      // update_thread_num 指定更新线程的数量，用于并发处理服务更新。
      int32 update_thread_num = 5;
      // not_load_cache_at_start 指定启动时是否不加载本地缓存，为 true
      // 时忽略缓存。
      bool not_load_cache_at_start = 6;
      // update_cache_when_empty 指定当服务列表为空时是否更新缓存。
      bool update_cache_when_empty = 7;
      // log_dir 指定客户端日志的输出目录路径。
      string log_dir = 8;
      // log_level 指定客户端日志级别，可选值包括：debug、info、warn、error。
      string log_level = 9;
      // namespace_id 命名空间 ID，用于标识不同的命名空间。
      string namespace_id = 10;
      // username 命名空间用户名，用于访问 Nacos 服务。
      string username = 11;
      // password 命名空间密码，用于访问 Nacos 服务。
      string password = 12;
    }
    string server_addr = 1;
    int32 server_port = 2;
    Client client = 3;
  }
  // type 配置注册系统的类型，使用 RegisterType 枚举。
  RegisterType type = 1;
  // nacos 配置 Nacos 注册系统的参数。
  Nacos nacos = 2;
}