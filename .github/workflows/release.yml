# 定义 GitHub Actions 工作流的名称。
name: Release
# 定义触发工作流执行的事件。
"on":
  # 当创建新的 Release 时触发工作流。
  release:
    types: [created]
# 设置工作流权限。
permissions:
  contents: write
  actions: read
  checks: read
  deployments: read
  issues: read
  packages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read
env:
  # 获取 git 提交哈希值。
  GIT_COMMIT: ${{ github.sha }}
  # 构建时间。
  BUILD_TIME: ${{ github.run_number }}
  # Go 版本。
  GO_VERSION: '1.25'
  # 应用名称。
  APP_NAME: kratos-layout
  # 软件版本。
  APP_VERSION: ${{ github.event.release.name }}
jobs:
  # 定义构建任务。
  build:
    name: Build and Upload
    runs-on: ubuntu-latest
    steps:
      # 检出代码。
      - name: Checkout code
        uses: actions/checkout@v4
      # 设置 Go 环境。
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # 获取依赖。
      - name: Download dependencies
        run: go mod download
      # 安装 UPX（用于压缩可执行文件）。
      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl
      # 使用 Makefile 构建所有平台的可执行文件。
      - name: Build all binaries using Makefile
        env:
          GIT_COMMIT: ${{ env.GIT_COMMIT }}
          BUILD_TIME: $(date -u +%Y%m%d%H%M%S)
        run: |
          # 使用 Makefile 构建所有平台。
          make build

          # 显示构建结果。
          echo "Build completed. All binaries:"
          find bin/ -type f -executable
      # 创建所有平台的压缩包。
      - name: Create archives for all platforms
        run: |
          # 定义平台和架构组合。
          platforms=("linux_amd64" "linux_arm64" "darwin_amd64" \
                      "darwin_arm64" "windows_amd64" "windows_arm64")

          for platform in "${platforms[@]}"; do
            if [ -d "bin/$platform" ] && [ "$(ls -A bin/$platform)" ]; then
              echo "Creating archive for $platform..."
              cd bin/$platform

              # 根据平台选择压缩格式。
              if [[ $platform == windows* ]]; then
                # Windows 使用 zip 格式
                archive_name="../../${{ env.APP_NAME }}-${platform/_/-}-${{ env.APP_VERSION }}.zip"
                zip -9 -T -r "$archive_name" .
                echo "Created: ${{ env.APP_NAME }}-${platform/_/-}-${{ env.APP_VERSION }}.zip"
              else
                # Linux 和 macOS 使用 tar.gz 格式
                archive_name="../../${{ env.APP_NAME }}-${platform/_/-}-${{ env.APP_VERSION }}.tar.gz"
                tar -czf "$archive_name" .
                echo "Created: ${{ env.APP_NAME }}-${platform/_/-}-${{ env.APP_VERSION }}.tar.gz"
              fi
              cd ../..
            else
              echo "No binaries found for $platform, skipping..."
            fi
          done

          # 显示所有创建的压缩包。
          echo "All archives created:"
          ls -la *.zip *.tar.gz 2>/dev/null || echo "No archives found"
      # 上传到 Release。
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.zip
            *.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 生成校验和。
      - name: Generate checksums
        run: |
          if ls *.zip *.tar.gz 1> /dev/null 2>&1; then
            echo "Generating SHA256 checksums..."
            sha256sum *.zip *.tar.gz | tee ${{ env.APP_NAME }}-${{ env.APP_VERSION }}.sha256

            echo "Generating MD5 checksums..."
            md5sum *.zip *.tar.gz | tee ${{ env.APP_NAME }}-${{ env.APP_VERSION }}.md5

            echo "Generated checksums:"
            cat ${{ env.APP_NAME }}-${{ env.APP_VERSION }}.sha256
            cat ${{ env.APP_NAME }}-${{ env.APP_VERSION }}.md5
          else
            echo "No archive files found"
            exit 1
          fi
      # 上传校验和文件。
      - name: Upload checksums
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.APP_NAME }}-${{ env.APP_VERSION }}.sha256
            ${{ env.APP_NAME }}-${{ env.APP_VERSION }}.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}